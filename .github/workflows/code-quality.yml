name: "code quality"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/src/catalog/catalog.json"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".eslintrc*"
      - "eslint.config.*"
      - ".prettierrc*"
      - "tsconfig*"
      - "tailwind.config.*"
      - ".github/workflows/**"
      - "licenses-allowed.json"
      - "src-tauri/Cargo.lock"
      - "src-tauri/deny.toml"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/src/catalog/catalog.json"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".eslintrc*"
      - "eslint.config.*"
      - ".prettierrc*"
      - "tsconfig*"
      - "tailwind.config.*"
      - ".github/workflows/**"
      - "licenses-allowed.json"
      - "src-tauri/Cargo.lock"
      - "src-tauri/deny.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check translation consistency
        run: bun run check:translations

      - name: Check model language coverage
        run: bun run check:model-languages

      - name: Check bundled model catalog matches @handy-computer/models
        run: bun run check:catalog

      - name: Test keyboard utilities
        run: bun run test:keyboard

      - name: Test release scripts
        run: bun run test:scripts

      - name: Check npm licences
        run: bun run check:licenses

      - name: Run ESLint
        run: bun run lint

      - name: Run prettier
        run: bun run format:check

  licenses-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check Rust licences
        working-directory: src-tauri
        run: cargo deny --locked check licenses
